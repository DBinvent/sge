
[config]
skip_core_tasks = true

[config.modify_core_tasks]
private = true

[tasks.build]
command = "cargo"
args = ["build", "--bins"]
description = "Runs the rust compiler to build"

[tasks.test]
command = "cargo"
args = ["test", "--", "--nocapture"]
description = "Runs the rust test"

[tasks.postgres-up]
command = "./tests/postgres.sh"
args = ["start", "/tmp/db", "5434", "12"]
description = "Prepare and run postgres"

[tasks.postgres-drop]
command = "./tests/postgres.sh"
args = ["stop", "/tmp/db", "5434"]
description = "Stop postgres"

[tasks.clean]
dependencies = ["postgres-drop"]
script = "rm -rf /tmp/db/5434"

[tasks.cfg-prepare]
cwd = "tests"
#condition = { files_not_exist = "local_test_cfg.yaml"}
script = "echo cp test_cfg.yaml local_test_cfg.yaml"

[tasks.run]
dependencies = ["test"]
#dependencies = ["test", "build", "postgres-up", "cfg-prepare"]
cwd = "tests"
script = [
'''
# --test integration-test migration_tests
#cargo build --bin sl && ./target/debug/sl ./tests/corp.rsa ./tests/test_rdbm.license  > tests/signed_test_rdbm.licens
#cargo build --bin rdbm && ./target/debug/rdbm -c ./tests/local_test_cfg.yaml --license_file=./tests/signed_test_rdbm.license license && echo OK

#grep -q db_user ./test_cfg.yaml || echo "db_user: \"$USER\" " >> ./test_cfg.yaml
#../target/debug/rdbm -c ./local_test_cfg.yaml migrate
#psql -p 5434 -h $(pwd)/db/5434 -c "select count(*) from rdbm_history" ucb

#cargo test --test integration-test --  --nocapture

#ps augx | grep tmp/tests/

rm -rf /tmp/tests
echo TESTED OK
'''
]

[tasks.all]
dependencies = ["test", "build", "postgres-up", "run", "clean"]
script = "echo TESTED OK"

[tasks.default]
dependencies = ["run"]
workspace = false
