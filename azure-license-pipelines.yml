
schedules:
- cron: '0 10 * * * '
  displayName: 'Evaluation license update'
  branches:
    include: [ 'main' ] # which branches the schedule applies to
  always: true

trigger:
- master

pool:
  name: Default

steps:
  - bash: $HOME/.cargo/cargo build --bin sl --release
    displayName: cargo build --release

  - bash: |
      target/release/sl /etc/corp0.rsa evaluation.license
    displayName: sign

  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)'
      Contents: |
        evaluation.license
        upgrade-latest.sh
      TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
      CleanTargetFolder: false
      OverWrite: true

  - task: ArchiveFiles@2
    displayName: 'Archive files'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/release'
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      replaceExistingArchive: true

  - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
    artifact: drop  

