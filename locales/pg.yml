# [i18n] see zip.yml - a statement of a schema deploy Postgres refused (dbm_pg.rs): the
# statement, its file, and Postgres's own error in full
_version: 2
pg.source:
  en: ", source: %{file}"
  ru: ", источник: %{file}"
  fr: ", source : %{file}"
  de: ", Quelle: %{file}"
  zh: "，来源：%{file}"
  ja: "（ソース：%{file}）"
pg.table:
