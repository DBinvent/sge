# [i18n] see zip.yml - plan's digest (dbm_digest.rs)
_version: 2
digest.title:
  en: "sge plan: %{target}"
  ru: "план sge: %{target}"
  fr: "plan sge : %{target}"
  de: "sge-Plan: %{target}"
  zh: "sge 计划：%{target}"
  ja: "sge の計画：%{target}"
digest.summary:
  en: "tables: %{tables}, scripts: %{files}"
  ru: "таблиц: %{tables}, скриптов: %{files}"
  fr: "tables : %{tables}, scripts : %{files}"
  de: "Tabellen: %{tables}, Skripte: %{files}"
  zh: "%{tables} 张表，%{files} 个脚本"
  ja: "テーブル %{tables}、スクリプト %{files}"
digest.counts:
  en: "dml: rows counted in the database as it is now; N statements: their rows not counted - on a table the plan creates, or a statement that cannot be counted"
  ru: "dml: строки, подсчитанные в базе как она есть сейчас; N statements: операторы, чьи строки не подсчитаны - на таблице, которую создаёт план, или такие, что нельзя подсчитать"
  fr: "dml : lignes comptées dans la base telle qu'elle est ; N statements : des instructions dont les lignes ne sont pas comptées - sur une table que le plan crée, ou impossibles à compter"
  de: "dml: Zeilen, in der Datenbank in ihrem jetzigen Stand gezählt; N statements: Anweisungen, deren Zeilen nicht gezählt sind - auf einer Tabelle, die der Plan anlegt, oder nicht zählbar"
  zh: "dml：按数据库当前状态统计的行数；N statements：未统计行数的语句 - 作用于计划将创建的表，或无法统计"
  ja: "dml：データベースの現在の状態で数えた行数。N statements：行を数えていない文 - 計画が作るテーブルへの文、または数えられない文"
