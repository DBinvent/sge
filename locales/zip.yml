# [i18n] sge's messages: src/i18n.rs. Each in every language - en, ru, and, not
# reviewed, fr, de, zh (Simplified Chinese), ja. An error starts with its code,
# SGE-Ennn, the same in every language; a log line has none.
_version: 2
zip.removed:
  en: "[zip] removed %{dir}"
  ru: "[zip] удалён %{dir}"
  fr: "[zip] supprimé : %{dir}"
  de: "[zip] entfernt: %{dir}"
  zh: "[zip] 已删除 %{dir}"
  ja: "[zip] %{dir} を削除しました"
zip.not_removed:
  en: "[zip] %{dir} not removed: %{err}"
  ru: "[zip] %{dir} не удалён: %{err}"
  fr: "[zip] %{dir} non supprimé : %{err}"
  de: "[zip] %{dir} nicht entfernt: %{err}"
  zh: "[zip] 未能删除 %{dir}：%{err}"
  ja: "[zip] %{dir} を削除できません：%{err}"
zip.both_sources:
  en: "SGE-E601 source_zip and source_git are both set: a run has one script source"
  ru: "SGE-E601 заданы и source_zip, и source_git: у запуска один источник скриптов"
  fr: "SGE-E601 source_zip et source_git sont tous deux définis : une exécution n'a qu'une source de scripts"
  de: "SGE-E601 source_zip und source_git sind beide gesetzt: ein Lauf hat eine Skriptquelle"
  zh: "SGE-E601 同时设置了 source_zip 和 source_git：一次运行只能有一个脚本来源"
  ja: "SGE-E601 source_zip と source_git の両方が設定されています：1 回の実行のスクリプト取得元は 1 つです"
zip.no_file:
  en: "SGE-E602 source_zip %{archive}: no such file"
  ru: "SGE-E602 source_zip %{archive}: нет такого файла"
  fr: "SGE-E602 source_zip %{archive} : fichier introuvable"
  de: "SGE-E602 source_zip %{archive}: Datei nicht vorhanden"
  zh: "SGE-E602 source_zip %{archive}：文件不存在"
  ja: "SGE-E602 source_zip %{archive}：ファイルがありません"
zip.no_name:
  en: "SGE-E603 source_zip %{archive}: not a file name to unpack under"
  ru: "SGE-E603 source_zip %{archive}: не имя файла, под которым можно распаковать"
  fr: "SGE-E603 source_zip %{archive} : pas un nom de fichier sous lequel décompresser"
  de: "SGE-E603 source_zip %{archive}: kein Dateiname, unter dem entpackt werden kann"
  zh: "SGE-E603 source_zip %{archive}：不是可用于解压的文件名"
  ja: "SGE-E603 source_zip %{archive}：展開先に使えるファイル名ではありません"
zip.max_mb:
  en: "SGE-E604 source_zip_max_mb: not a number: %{value}"
  ru: "SGE-E604 source_zip_max_mb: не число: %{value}"
  fr: "SGE-E604 source_zip_max_mb : pas un nombre : %{value}"
  de: "SGE-E604 source_zip_max_mb: keine Zahl: %{value}"
  zh: "SGE-E604 source_zip_max_mb：不是数字：%{value}"
  ja: "SGE-E604 source_zip_max_mb：数値ではありません：%{value}"
zip.tmp:
  en: "SGE-E605 source_zip_tmp %{dir}: %{err}"
  ru: "SGE-E605 source_zip_tmp %{dir}: %{err}"
  fr: "SGE-E605 source_zip_tmp %{dir} : %{err}"
  de: "SGE-E605 source_zip_tmp %{dir}: %{err}"
  zh: "SGE-E605 source_zip_tmp %{dir}：%{err}"
  ja: "SGE-E605 source_zip_tmp %{dir}：%{err}"
zip.pid:
  en: "SGE-E606 cannot write the pid file %{file}: %{err}"
  ru: "SGE-E606 не удаётся записать pid-файл %{file}: %{err}"
  fr: "SGE-E606 impossible d'écrire le fichier pid %{file} : %{err}"
  de: "SGE-E606 die pid-Datei %{file} lässt sich nicht schreiben: %{err}"
  zh: "SGE-E606 无法写入 pid 文件 %{file}：%{err}"
  ja: "SGE-E606 pid ファイル %{file} を書き込めません：%{err}"
zip.sub_missing:
  en: "SGE-E607 source_zip_dir %{sub}: not a directory in %{archive}"
  ru: "SGE-E607 source_zip_dir %{sub}: в %{archive} нет такого каталога"
  fr: "SGE-E607 source_zip_dir %{sub} : pas un dossier de %{archive}"
  de: "SGE-E607 source_zip_dir %{sub}: kein Verzeichnis in %{archive}"
  zh: "SGE-E607 source_zip_dir %{sub}：不是 %{archive} 中的目录"
  ja: "SGE-E607 source_zip_dir %{sub}：%{archive} 内のディレクトリではありません"
zip.dir:
  en: "SGE-E608 cannot create or replace %{dir}: %{err}"
  ru: "SGE-E608 не удаётся создать или заменить %{dir}: %{err}"
  fr: "SGE-E608 impossible de créer ou de remplacer %{dir} : %{err}"
  de: "SGE-E608 %{dir} lässt sich nicht anlegen oder ersetzen: %{err}"
  zh: "SGE-E608 无法创建或替换 %{dir}：%{err}"
  ja: "SGE-E608 %{dir} を作成または置き換えできません：%{err}"
zip.in_use:
  en: "SGE-E609 %{dir} is in use by run %{pid}: another sge is reading it"
  ru: "SGE-E609 %{dir} занят запуском %{pid}: его читает другой sge"
  fr: "SGE-E609 %{dir} est utilisé par l'exécution %{pid} : un autre sge le lit"
  de: "SGE-E609 %{dir} wird von Lauf %{pid} benutzt: ein anderes sge liest es"
  zh: "SGE-E609 %{dir} 正被运行 %{pid} 使用：另一个 sge 正在读取它"
  ja: "SGE-E609 %{dir} は実行 %{pid} が使用中です：別の sge が読み込んでいます"
zip.unclaimed:
  en: "SGE-E610 %{dir} is there already and names no run in %{pid_file}: another sge may be unpacking into it - remove it if none is"
  ru: "SGE-E610 %{dir} уже есть, а в %{pid_file} не указан запуск: возможно, в него распаковывает другой sge — удалите его, если это не так"
  fr: "SGE-E610 %{dir} existe déjà et %{pid_file} ne désigne aucune exécution : un autre sge y décompresse peut-être — supprimez-le si ce n'est pas le cas"
  de: "SGE-E610 %{dir} gibt es schon, und %{pid_file} nennt keinen Lauf: vielleicht entpackt ein anderes sge hinein - entfernen Sie es, wenn nicht"
  zh: "SGE-E610 %{dir} 已存在，而 %{pid_file} 中没有记录任何运行：可能另一个 sge 正在向其中解压——若没有，请删除它"
  ja: "SGE-E610 %{dir} が既にあり、%{pid_file} に実行の記録がありません：別の sge が展開中かもしれません。そうでなければ削除してください"
zip.sub_outside:
  en: "SGE-E611 source_zip_dir must be a path inside the archive: %{sub}"
  ru: "SGE-E611 source_zip_dir должен быть путём внутри архива: %{sub}"
  fr: "SGE-E611 source_zip_dir doit être un chemin à l'intérieur de l'archive : %{sub}"
  de: "SGE-E611 source_zip_dir muss ein Pfad innerhalb des Archivs sein: %{sub}"
  zh: "SGE-E611 source_zip_dir 必须是压缩包内的路径：%{sub}"
  ja: "SGE-E611 source_zip_dir はアーカイブ内のパスでなければなりません：%{sub}"
zip.archive:
  en: "SGE-E612 source_zip %{archive}: %{err}"
  ru: "SGE-E612 source_zip %{archive}: %{err}"
  fr: "SGE-E612 source_zip %{archive} : %{err}"
  de: "SGE-E612 source_zip %{archive}: %{err}"
  zh: "SGE-E612 source_zip %{archive}：%{err}"
  ja: "SGE-E612 source_zip %{archive}：%{err}"
zip.entry_outside:
  en: "SGE-E613 source_zip %{archive}: entry %{entry} would land outside the directory - refused"
  ru: "SGE-E613 source_zip %{archive}: элемент %{entry} попал бы за пределы каталога — архив отвергнут"
  fr: "SGE-E613 source_zip %{archive} : l'entrée %{entry} sortirait du dossier — refusée"
  de: "SGE-E613 source_zip %{archive}: Eintrag %{entry} landete außerhalb des Verzeichnisses - abgelehnt"
  zh: "SGE-E613 source_zip %{archive}：条目 %{entry} 会落到目录之外——已拒绝"
  ja: "SGE-E613 source_zip %{archive}：エントリ %{entry} はディレクトリの外に出ます。拒否しました"
zip.entry_symlink:
  en: "SGE-E614 source_zip %{archive}: entry %{entry} is a symlink - refused"
  ru: "SGE-E614 source_zip %{archive}: элемент %{entry} — символическая ссылка, архив отвергнут"
  fr: "SGE-E614 source_zip %{archive} : l'entrée %{entry} est un lien symbolique — refusée"
  de: "SGE-E614 source_zip %{archive}: Eintrag %{entry} ist ein symbolischer Link - abgelehnt"
  zh: "SGE-E614 source_zip %{archive}：条目 %{entry} 是符号链接——已拒绝"
  ja: "SGE-E614 source_zip %{archive}：エントリ %{entry} はシンボリックリンクです。拒否しました"
zip.too_big:
  en: "SGE-E615 source_zip %{archive}: unpacks to more than source_zip_max_mb (%{mb} MiB) - refused"
  ru: "SGE-E615 source_zip %{archive}: распаковывается больше чем в source_zip_max_mb (%{mb} МиБ) — архив отвергнут"
  fr: "SGE-E615 source_zip %{archive} : se décompresse au-delà de source_zip_max_mb (%{mb} Mio) — refusée"
  de: "SGE-E615 source_zip %{archive}: entpackt mehr als source_zip_max_mb (%{mb} MiB) - abgelehnt"
  zh: "SGE-E615 source_zip %{archive}：解压后超过 source_zip_max_mb（%{mb} MiB）——已拒绝"
  ja: "SGE-E615 source_zip %{archive}：展開すると source_zip_max_mb（%{mb} MiB）を超えます。拒否しました"
zip.read:
  en: "SGE-E616 cannot read %{file}: %{err}"
  ru: "SGE-E616 не удаётся прочитать %{file}: %{err}"
  fr: "SGE-E616 impossible de lire %{file} : %{err}"
  de: "SGE-E616 %{file} lässt sich nicht lesen: %{err}"
  zh: "SGE-E616 无法读取 %{file}：%{err}"
  ja: "SGE-E616 %{file} を読み込めません：%{err}"
zip.unpacked:
  en: "[zip] %{archive} unpacked into %{dir}: %{files} file(s), scripts from %{path} (%{tag})"
  ru: "[zip] %{archive} распакован в %{dir}: файлов: %{files}, скрипты из %{path} (%{tag})"
  fr: "[zip] %{archive} décompressée dans %{dir} : %{files} fichier(s), scripts lus dans %{path} (%{tag})"
  de: "[zip] %{archive} entpackt nach %{dir}: %{files} Datei(en), Skripte aus %{path} (%{tag})"
  zh: "[zip] %{archive} 已解压到 %{dir}：%{files} 个文件，脚本来自 %{path}（%{tag}）"
  ja: "[zip] %{archive} を %{dir} に展開しました：%{files} 個のファイル、スクリプトは %{path} から（%{tag}）"
zip.stale:
  en: "[zip] %{dir} left by run %{pid}, which is gone - removed"
  ru: "[zip] %{dir} оставлен запуском %{pid}, которого уже нет — удалён"
  fr: "[zip] %{dir} laissé par l'exécution %{pid}, terminée — supprimé"
  de: "[zip] %{dir} von Lauf %{pid} zurückgelassen, der nicht mehr läuft - entfernt"
  zh: "[zip] %{dir} 由已结束的运行 %{pid} 遗留——已删除"
  ja: "[zip] %{dir} は終了した実行 %{pid} が残したものです。削除しました"
