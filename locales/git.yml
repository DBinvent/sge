# [i18n] see zip.yml
_version: 2
git.flag_url:
  en: "SGE-E501 source_git must not start with '-': %{url}"
  ru: "SGE-E501 source_git не должен начинаться с '-': %{url}"
  fr: "SGE-E501 source_git ne doit pas commencer par '-' : %{url}"
  de: "SGE-E501 source_git darf nicht mit '-' beginnen: %{url}"
  zh: "SGE-E501 source_git 不能以 '-' 开头：%{url}"
  ja: "SGE-E501 source_git は '-' で始めてはいけません：%{url}"
git.nul:
  en: "SGE-E502 source_git contains a NUL byte"
  ru: "SGE-E502 source_git содержит байт NUL"
  fr: "SGE-E502 source_git contient un octet NUL"
  de: "SGE-E502 source_git enthält ein NUL-Byte"
  zh: "SGE-E502 source_git 含有 NUL 字节"
  ja: "SGE-E502 source_git に NUL バイトが含まれています"
git.key_quotes:
  en: "SGE-E503 source_git_ssh_key must not contain quotes or newlines: %{path}"
  ru: "SGE-E503 source_git_ssh_key не должен содержать кавычек и переводов строки: %{path}"
  fr: "SGE-E503 source_git_ssh_key ne doit contenir ni guillemets ni retours à la ligne : %{path}"
  de: "SGE-E503 source_git_ssh_key darf keine Anführungszeichen oder Zeilenumbrüche enthalten: %{path}"
  zh: "SGE-E503 source_git_ssh_key 不能包含引号或换行：%{path}"
  ja: "SGE-E503 source_git_ssh_key に引用符や改行を含めてはいけません：%{path}"
git.cred_space:
  en: "SGE-E504 source_git_credentials must not contain whitespace: %{path}"
  ru: "SGE-E504 source_git_credentials не должен содержать пробелов: %{path}"
  fr: "SGE-E504 source_git_credentials ne doit pas contenir d'espaces : %{path}"
  de: "SGE-E504 source_git_credentials darf keine Leerzeichen enthalten: %{path}"
  zh: "SGE-E504 source_git_credentials 不能包含空白字符：%{path}"
  ja: "SGE-E504 source_git_credentials に空白を含めてはいけません：%{path}"
git.not_run:
  en: "SGE-E505 git %{args}: %{err} (is git installed and on PATH?)"
  ru: "SGE-E505 git %{args}: %{err} (установлен ли git и есть ли он в PATH?)"
  fr: "SGE-E505 git %{args} : %{err} (git est-il installé et dans le PATH ?)"
  de: "SGE-E505 git %{args}: %{err} (ist git installiert und im PATH?)"
  zh: "SGE-E505 git %{args}：%{err}（是否已安装 git 并在 PATH 中？）"
  ja: "SGE-E505 git %{args}：%{err}（git はインストールされ、PATH にありますか？）"
git.failed:
  en: "SGE-E506 git %{args} failed: %{err}"
  ru: "SGE-E506 git %{args} завершился с ошибкой: %{err}"
  fr: "SGE-E506 git %{args} a échoué : %{err}"
  de: "SGE-E506 git %{args} fehlgeschlagen: %{err}"
  zh: "SGE-E506 git %{args} 失败：%{err}"
  ja: "SGE-E506 git %{args} が失敗しました：%{err}"
git.cache:
  en: "SGE-E507 source_git_cache %{dir}: %{err}"
  ru: "SGE-E507 source_git_cache %{dir}: %{err}"
  fr: "SGE-E507 source_git_cache %{dir} : %{err}"
  de: "SGE-E507 source_git_cache %{dir}: %{err}"
  zh: "SGE-E507 source_git_cache %{dir}：%{err}"
  ja: "SGE-E507 source_git_cache %{dir}：%{err}"
git.replace:
  en: "SGE-E508 replacing %{dir}: %{err}"
  ru: "SGE-E508 не удаётся заменить %{dir}: %{err}"
  fr: "SGE-E508 remplacement de %{dir} : %{err}"
  de: "SGE-E508 %{dir} lässt sich nicht ersetzen: %{err}"
  zh: "SGE-E508 替换 %{dir} 时出错：%{err}"
  ja: "SGE-E508 %{dir} を置き換えできません：%{err}"
git.sub_outside:
  en: "SGE-E509 source_git_dir must stay inside the repository: %{sub}"
  ru: "SGE-E509 source_git_dir должен быть внутри репозитория: %{sub}"
  fr: "SGE-E509 source_git_dir doit rester à l'intérieur du dépôt : %{sub}"
  de: "SGE-E509 source_git_dir muss innerhalb des Repositorys bleiben: %{sub}"
  zh: "SGE-E509 source_git_dir 必须位于仓库之内：%{sub}"
  ja: "SGE-E509 source_git_dir はリポジトリ内になければなりません：%{sub}"
git.sub_missing:
  en: "SGE-E510 source_git_dir '%{sub}' does not exist in %{url} at %{commit}"
  ru: "SGE-E510 source_git_dir '%{sub}' нет в %{url} на коммите %{commit}"
  fr: "SGE-E510 source_git_dir '%{sub}' n'existe pas dans %{url} au commit %{commit}"
  de: "SGE-E510 source_git_dir '%{sub}' gibt es in %{url} bei %{commit} nicht"
  zh: "SGE-E510 %{url} 的提交 %{commit} 中不存在 source_git_dir '%{sub}'"
  ja: "SGE-E510 %{url} のコミット %{commit} に source_git_dir '%{sub}' がありません"
git.ref_missing:
  en: "SGE-E511 source_git_ref '%{requested}' not found"
  ru: "SGE-E511 source_git_ref '%{requested}' не найден"
  fr: "SGE-E511 source_git_ref '%{requested}' introuvable"
  de: "SGE-E511 source_git_ref '%{requested}' nicht gefunden"
  zh: "SGE-E511 未找到 source_git_ref '%{requested}'"
  ja: "SGE-E511 source_git_ref '%{requested}' が見つかりません"
git.updating:
  en: "[git] updating %{url} in %{dir}"
  ru: "[git] обновление %{url} в %{dir}"
  fr: "[git] mise à jour de %{url} dans %{dir}"
  de: "[git] aktualisiere %{url} in %{dir}"
  zh: "[git] 更新 %{dir} 中的 %{url}"
  ja: "[git] %{dir} の %{url} を更新しています"
git.origin_changed:
  en: "[git] origin changed %{from} -> %{to}, re-cloning"
  ru: "[git] origin изменился: %{from} -> %{to}, клонирую заново"
  fr: "[git] origin a changé : %{from} -> %{to}, nouveau clonage"
  de: "[git] origin geändert: %{from} -> %{to}, klone neu"
  zh: "[git] origin 已更改：%{from} -> %{to}，重新克隆"
  ja: "[git] origin が変更されました：%{from} -> %{to}。クローンし直します"
git.cloning:
  en: "[git] cloning %{url} into %{dir}"
  ru: "[git] клонирование %{url} в %{dir}"
  fr: "[git] clonage de %{url} dans %{dir}"
  de: "[git] klone %{url} nach %{dir}"
  zh: "[git] 克隆 %{url} 到 %{dir}"
  ja: "[git] %{url} を %{dir} にクローンしています"
git.source:
  en: "[git] source %{url} @ %{commit} (%{requested})"
  ru: "[git] источник %{url} @ %{commit} (%{requested})"
  fr: "[git] source %{url} @ %{commit} (%{requested})"
  de: "[git] Quelle %{url} @ %{commit} (%{requested})"
  zh: "[git] 来源 %{url} @ %{commit}（%{requested}）"
  ja: "[git] ソース %{url} @ %{commit}（%{requested}）"
git.unshallow:
  en: "[git] shallow fetch of '%{requested}' refused, unshallowing"
  ru: "[git] поверхностное получение '%{requested}' отклонено, получаю всю историю"
  fr: "[git] récupération superficielle de '%{requested}' refusée, récupération de tout l'historique"
  de: "[git] flaches Holen von '%{requested}' abgelehnt, hole den ganzen Verlauf"
  zh: "[git] 浅获取 '%{requested}' 被拒绝，改为获取完整历史"
  ja: "[git] '%{requested}' のシャロー取得が拒否されたため、全履歴を取得します"
