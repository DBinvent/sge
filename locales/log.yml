# [i18n] see zip.yml - the history, and the scripts psql runs
_version: 2
log.yaml:
  en: "SGE-E301 converting the result to YAML: %{err}"
  ru: "SGE-E301 преобразование результата в YAML: %{err}"
  fr: "SGE-E301 conversion du résultat en YAML : %{err}"
  de: "SGE-E301 Umwandlung des Ergebnisses in YAML: %{err}"
  zh: "SGE-E301 把结果转换为 YAML 时出错：%{err}"
  ja: "SGE-E301 結果の YAML への変換：%{err}"
log.json:
  en: "SGE-E302 converting the result to JSON: %{err}"
  ru: "SGE-E302 преобразование результата в JSON: %{err}"
  fr: "SGE-E302 conversion du résultat en JSON : %{err}"
  de: "SGE-E302 Umwandlung des Ergebnisses in JSON: %{err}"
  zh: "SGE-E302 把结果转换为 JSON 时出错：%{err}"
  ja: "SGE-E302 結果の JSON への変換：%{err}"
log.select:
  en: "SGE-E303 reading the history [%{sql}]: %{err}"
  ru: "SGE-E303 чтение журнала [%{sql}]: %{err}"
  fr: "SGE-E303 lecture de l'historique [%{sql}] : %{err}"
  de: "SGE-E303 Lesen des Verlaufs [%{sql}]: %{err}"
  zh: "SGE-E303 读取历史记录 [%{sql}]：%{err}"
  ja: "SGE-E303 履歴の読み込み [%{sql}]：%{err}"
log.lock:
  en: "SGE-E304 locking the history [%{sql}]: %{err}"
  ru: "SGE-E304 блокировка журнала [%{sql}]: %{err}"
  fr: "SGE-E304 verrouillage de l'historique [%{sql}] : %{err}"
  de: "SGE-E304 Sperren des Verlaufs [%{sql}]: %{err}"
  zh: "SGE-E304 锁定历史记录 [%{sql}]：%{err}"
  ja: "SGE-E304 履歴のロック [%{sql}]：%{err}"
log.checksum:
  en: "SGE-E305 version %{version} script %{file} changed after it was deployed: checksum mismatch"
  ru: "SGE-E305 скрипт %{file} версии %{version} изменился после развёртывания: контрольная сумма не совпадает"
  fr: "SGE-E305 le script %{file} de la version %{version} a changé après son déploiement : somme de contrôle différente"
  de: "SGE-E305 das Skript %{file} der Version %{version} hat sich nach der Bereitstellung geändert: Prüfsumme weicht ab"
  zh: "SGE-E305 版本 %{version} 的脚本 %{file} 在部署后被修改：校验和不一致"
  ja: "SGE-E305 バージョン %{version} のスクリプト %{file} がデプロイ後に変更されています：チェックサムが一致しません"
log.psql_failed:
  en: "SGE-E306 psql failed on %{file}: %{out} %{err}"
  ru: "SGE-E306 psql завершился с ошибкой на %{file}: %{out} %{err}"
  fr: "SGE-E306 psql a échoué sur %{file} : %{out} %{err}"
  de: "SGE-E306 psql ist bei %{file} fehlgeschlagen: %{out} %{err}"
  zh: "SGE-E306 psql 执行 %{file} 失败：%{out} %{err}"
  ja: "SGE-E306 psql が %{file} で失敗しました：%{out} %{err}"
log.psql_start:
  en: "SGE-E307 psql could not run %{file}: %{err} (is psql installed and on PATH?)"
  ru: "SGE-E307 psql не удалось запустить для %{file}: %{err} (установлен ли psql и есть ли он в PATH?)"
  fr: "SGE-E307 impossible de lancer psql pour %{file} : %{err} (psql est-il installé et dans le PATH ?)"
  de: "SGE-E307 psql ließ sich für %{file} nicht starten: %{err} (ist psql installiert und im PATH?)"
  zh: "SGE-E307 无法运行 psql 执行 %{file}：%{err}（是否已安装 psql 并在 PATH 中？）"
  ja: "SGE-E307 %{file} のために psql を実行できません：%{err}（psql はインストールされ、PATH にありますか？）"
log.history_write:
  en: "SGE-E308 writing the history [%{sql}]: %{err}"
  ru: "SGE-E308 запись в журнал [%{sql}]: %{err}"
  fr: "SGE-E308 écriture de l'historique [%{sql}] : %{err}"
  de: "SGE-E308 Schreiben des Verlaufs [%{sql}]: %{err}"
  zh: "SGE-E308 写入历史记录 [%{sql}]：%{err}"
  ja: "SGE-E308 履歴の書き込み [%{sql}]：%{err}"
log.dump:
  en: "SGE-E309 writing the SQL to [%{file}]: %{err}"
  ru: "SGE-E309 запись SQL в [%{file}]: %{err}"
  fr: "SGE-E309 écriture du SQL dans [%{file}] : %{err}"
  de: "SGE-E309 Schreiben des SQL nach [%{file}]: %{err}"
  zh: "SGE-E309 把 SQL 写入 [%{file}] 时出错：%{err}"
  ja: "SGE-E309 SQL の [%{file}] への書き込み：%{err}"
log.executing:
  en: "executing %{file}..."
  ru: "выполняется %{file}..."
  fr: "exécution de %{file}..."
  de: "führe %{file} aus..."
  zh: "正在执行 %{file}..."
  ja: "%{file} を実行しています..."
log.executing_no_history:
  en: "executing %{file} (no history log)..."
  ru: "выполняется %{file} (без записи в журнал)..."
  fr: "exécution de %{file} (sans historique)..."
  de: "führe %{file} aus (ohne Verlauf)..."
  zh: "正在执行 %{file}（不记录历史）..."
  ja: "%{file} を実行しています（履歴には記録しません）..."
log.ok:
  en: "%{file}: OK"
  ru: "%{file}: OK"
  fr: "%{file} : OK"
  de: "%{file}: OK"
  zh: "%{file}：成功"
  ja: "%{file}：成功"
log.generated:
  en: "generated: %{bytes} bytes to %{file}"
  ru: "записано %{bytes} байт в %{file}"
  fr: "%{bytes} octets écrits dans %{file}"
  de: "%{bytes} Bytes nach %{file} geschrieben"
  zh: "已写入 %{bytes} 字节到 %{file}"
  ja: "%{file} に %{bytes} バイト書き込みました"
