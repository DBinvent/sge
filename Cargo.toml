[package]
name = "rdbm"
version = "0.1.0"
authors = ["vk <vk@dbinvent.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# https://doc.rust-lang.org/reference/linkage.html
[lib]
name = "rdbm"
path = "src/lib.rs"
crate-type = ["rlib"]
#crate-type = ["rlib", "cdylib", "staticlib", "dylib"]

[[bin]]
name = "rdbm"
path = "src/main.rs"

[dependencies]
slog = "^2.7.0"
slog-async = "^2.6.0"
slog-envlogger = "^2.2.0"
slog-stdlog = "^4.1.0"
slog-term = "^2.8.0"
sloggers = "^1.0.1"
lazy_static = "^1.4.0"
postgres = "^0.19.1"

ron = "^0.6.4"
serde ="^1.0.125"
yaml-rust = "^0.4.5"
semver = "^0.11.0"


crypto-hash = "^0.3.4"
rand = "^0.8.3"
base64 = "^0.13.0"
