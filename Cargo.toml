[package]
name = "schema_guard"
version = "2.3.0"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>", "DBinvent <support@dbinvent.com>"]
edition = "2018"
license = "MIT"
description = "Schema Guard Enterprise: Relation DataBase Schema Management tool"
repository = "https://github.com/DBinvent/sge.git"
homepage = "https://www.dbinvent.com/sge"
readme = "README.md"
documentation = "https://vkrinitsyn.github.io/sg1"
keywords = ["schema_guard", "sge", "postgres", "superset", "flyway"]

# https://doc.rust-lang.org/reference/linkage.html
[lib]
name = "sge"
path = "src/lib.rs"

[[bin]]
name = "sge"
path = "src/main.rs"
bench = false
doc = false
# the command line is the binary's alone: a crate using sge as a library (ytserv)
# leaves clap 2 and its yaml-rust 0.3 out with default-features = false
required-features = ["cli"]

[profile.release]

panic = 'abort'


[dependencies]
#std = {default-features=false, features=["panic_immediate_abort"]}

slog = { version = "^2.7.0", features=["max_level_debug"] }
slog-async = "^2.6.0"
slog-envlogger = "^2.2.0"
slog-stdlog = "^4.1.0"
slog-term = "^2.8.0"
sloggers = "^2.0.0"
lazy_static = "^1.4.0"
# [sg-tokio] async client, matching schema_guard_tokio's own tokio-postgres ^0.7
tokio-postgres = { version = "^0.7", features=["with-chrono-0_4"] }
tokio = { version = "^1.36", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }

chrono="^0.4.19"
time = "^0.3.36"
serde = { version = "^1.0", features = ["derive"] }

serde_json = "^1.0.64"
# [yaml] the YAML sge prints (dbm_log.rs to_yaml). Not serde_yaml: deprecated, and its
# unsafe-libyaml is unmaintained (RUSTSEC-2024-0449). serde-saphyr has no unsafe code;
# ^1.3 as etcds and diff-doc
serde-saphyr = "^2.0"
# the Yaml type schema_guard_tokio 2 takes; its default features add only encoding_rs
yaml-rust2 = { version = "^0.13", default-features = false }
semver = "^1.0.28"
linked-hash-map="^0.5.4"

# [md5] the script checksum (dbm_log.rs): RustCrypto's, the md-5 postgres-protocol
# already builds. Not rust-crypto: unmaintained, and it brought rustc-serialize and
# time 0.1 with their advisories
md-5 = "^0.11"
# clap 4 reads no YAML (its "yaml" feature is gone): main.rs builds the command line
# from i18n/*_clc.yaml (clap 2's schema) with yaml-rust2; "string" for the names and
# texts it reads there
clap = {version = "4.6.7", features = ["string"], optional = true}
base64 = "^0.23.1"

uuid = {version="^1.28.0", features = ["v4"]}
# [digest] a dry run's SQL read for its digest (dbm_digest.rs): tables, columns, rows.
# No recursive-protection: its stacker builds C; sqlparser's own depth limit stays
sqlparser = { version = "^0.63", default-features = false, features = ["std"] }
csv = "1.1.6"
# [zip] a zip archive as the script source (dbm_zip.rs): stored and deflated entries
# only - flate2's default backend, miniz_oxide, pure Rust; no bzip2, zstd, lzma or AES,
# which bring C libraries
zip = { version = "^9.0", default-features = false, features = ["deflate-flate2"] }
# ...whose flate2 comes with no backend: miniz_oxide, named here
flate2 = { version = "^1.1", default-features = false, features = ["rust_backend"] }
smallvec = "1.6.1"
# the messages, in locales/*.yml: compiled in, each in every language - see src/i18n.rs.
# (no i18n table name in brackets anywhere in this file: rust-i18n would read it as
# its configuration)
rust-i18n = "^4.2.4"

# 2.1: its messages in sge's language (set_lang, the logger's lang), and the _pg
# deploys, which return Postgres's own error for sge to say (dbm_pg.rs); 2.1.1: pg_error_in,
# the line of the statement the server points at; 2.2: the superset module (the superset
# feature); 2.3: the _plan deploys, whose dry run hands each table's schema.table and
# changes beside the SQL - plan's digest, no SQL read back
schema_guard_tokio = { version = "^2.3.0", features = ["slog"] }

#postgres-openssl = { version = "^0.5.0", optional = true }
#openssl = { version = "^0.10.33", optional = true }

postgres-native-tls = { version = "^0.5.0", optional = true }
native-tls = { version = "^0.2.11", optional = true }

#openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
default = ["cli", "superset"]
cli = ["dep:clap"]
# [superset] `--snapshot_format=superset`: the snapshot as Apache Superset's import bundle,
# with schema_guard_tokio 2.2's superset module. ytserv links this library with no
# default features: no superset there
superset = []
tls = ["dep:postgres-native-tls", "dep:native-tls"]
#openssl = ["dep:postgres-openssl", "dep:openssl"]

[package.metadata.deb]
# psql, which sge runs (dbm_log.rs); curl and openssl went with the licensing harness
depends = "postgresql-client"
maintainer = "DBinvent <support@dbinvent.com>"
# reprepro takes no package without one ("No section given ... skipping"), as yt-cluster's
section = "database"
maintainer-scripts = "deb-scripts"
assets= [
    ["target/release/sge", "usr/bin/", "755"],
    # man/build.sh writes the man pages, English and each translation of sge --help
    ["target/man/man1/sge.1.gz", "usr/share/man/man1/sge.1.gz", "644"],
    ["target/man/ru/man1/sge.1.gz", "usr/share/man/ru/man1/sge.1.gz", "644"],
    ["target/man/fr/man1/sge.1.gz", "usr/share/man/fr/man1/sge.1.gz", "644"],
    ["target/man/de/man1/sge.1.gz", "usr/share/man/de/man1/sge.1.gz", "644"],
    ["target/man/zh_CN/man1/sge.1.gz", "usr/share/man/zh_CN/man1/sge.1.gz", "644"],
    ["target/man/ja/man1/sge.1.gz", "usr/share/man/ja/man1/sge.1.gz", "644"],
    ["lib-licenses.txt", "usr/share/doc/schema-guard/lib-licenses.txt", "644"],
    ["COPYRIGHT", "usr/share/doc/schema-guard/copyright", "644"],
    ["LICENSE", "usr/share/doc/schema-guard/LICENSE", "644"],
    # the image's SBOM, CycloneDX - dist/build.sh takes it out of the image
    ["target/sbom/sbom.cdx.json", "usr/share/doc/schema-guard/sbom.cdx.json", "644"],
]

[package.metadata.generate-rpm]
# EL9 and any other rpm Linux on x86-64: the image's static (musl) sge, which
# dist/build.sh copies out to the source below - a glibc build of this host would
# need a newer glibc than EL9's 2.34. Named as the deb, schema-guard; published to
# apt.dbinvent.com/yum/el9, YT Cluster's yum repository (its yt-cluster-el9.repo)
name = "schema-guard"
license = "MIT"
auto-req = "disabled"
assets= [
    {source = "target/x86_64-unknown-linux-musl/release/sge", dest = "/usr/bin/sge", mode ="755"},
    {source = "target/man/man1/sge.1.gz", dest = "/usr/share/man/man1/sge.1.gz", mode = "644", doc = true},
    {source = "target/man/ru/man1/sge.1.gz", dest = "/usr/share/man/ru/man1/sge.1.gz", mode = "644", doc = true},
    {source = "target/man/fr/man1/sge.1.gz", dest = "/usr/share/man/fr/man1/sge.1.gz", mode = "644", doc = true},
    {source = "target/man/de/man1/sge.1.gz", dest = "/usr/share/man/de/man1/sge.1.gz", mode = "644", doc = true},
    {source = "target/man/zh_CN/man1/sge.1.gz", dest = "/usr/share/man/zh_CN/man1/sge.1.gz", mode = "644", doc = true},
    {source = "target/man/ja/man1/sge.1.gz", dest = "/usr/share/man/ja/man1/sge.1.gz", mode = "644", doc = true},
    {source = "lib-licenses.txt", dest = "/usr/share/doc/schema-guard/lib-licenses.txt", mode = "644", doc = true},
    {source = "COPYRIGHT", dest = "/usr/share/doc/schema-guard/copyright", mode = "644", doc = true},
    {source = "LICENSE", dest = "/usr/share/doc/schema-guard/LICENSE", mode = "644", doc = true},
    {source = "target/sbom/sbom.cdx.json", dest = "/usr/share/doc/schema-guard/sbom.cdx.json", mode = "644", doc = true},
]

# psql, which sge runs: EL9's own postgresql package or PGDG's postgresqlNN - a weak
# dependency, as there is no one name for both (and no postgresql-client)
[package.metadata.generate-rpm.recommends]
postgresql = "*"
