[package]
name = "rdbm"
version = "1.4.1"
authors = ["vk <vk@dbinvent.com>"]
edition = "2018"
license-file = "LICENSE"
description = "Rumba[rdbm]: Relation DataBase (Schema) Management tool"
homepage = "https://www.dbinvent.com/rdbm/"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# https://doc.rust-lang.org/reference/linkage.html
[lib]
name = "rdbm"
path = "src/lib.rs"
#crate-type = ["rlib", "dylib"]
#crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "rdbm"
path = "src/main.rs"
[profile.release]
opt-level = 'z'  # Optimize for size.
lto = true
codegen-units = 1
panic = 'abort'

[[bin]]
name = "sl"
path = "src/sl.rs"


[dependencies]
#std = {default-features=false, features=["panic_immediate_abort"]}
# cargo-deb

# num-bigint is nightly broken
num-bigint = "0.4.1"
slog = "^2.7.0"
slog-async = "^2.6.0"
slog-envlogger = "^2.2.0"
slog-stdlog = "^4.1.0"
slog-term = "^2.8.0"
sloggers = "^2.0.0"
lazy_static = "^1.4.0"
postgres = { version = "^0.19.1", features=["with-chrono-0_4", "with-time-0_2"] }
postgres-openssl = "^0.5.0"
openssl = "^0.10.33"
chrono="^0.4.19"
time = "^0.2.26"
serde = { version = "^1.0", features = ["derive"] }

serde_json = "^1.0.64"
serde_yaml = "^0.8.17"
yaml-rust = "^0.4.5"
semver = "^0.11.0"
linked-hash-map="^0.5.4"

rust-crypto = "^0.2.36"
rand = "^0.8.3"
base64 = "^0.13.0"
clap = {version = "2.33.3", features = ["yaml"]}

rsa = "^0.4.0"
sha-1 = "^0.9.4"
uuid = {version="^0.8.1", features = ["v4"]}
ipaddress = "^0.1.2"
ureq = "^2.1.1"

smallvec = "1.6.1"
yaml-validator = { git = "https://github.com/vkrinitsyn/yaml-validator", features = []}

#https://www.maxoberberger.net/blog/2013/05/creating-your-own-apt-repository.html

[package.metadata.deb]
depends = "postgresql-client, curl"
maintainer = "DBinvent <support@dbinvent.com>"
maintainer-scripts = "deb-scripts"
assets= [
    ["target/release/rdbm", "usr/bin/", "755"],
    ["evaluation.license", "etc/rdbm/", "664"],
    ["lib-licenses.txt", "usr/share/doc/rdbm/lib-licenses.txt", "644"],
    ["COPYRIGHT", "usr/share/doc/rdbm/copyright", "644"],
    ["LICENSE", "usr/share/doc/rdbm/LICENSE", "644"],
]

[package.metadata.generate-rpm]
license = "LICENSE"
post_install_script = "curl -s -o /etc/rdbm/evaluation.license https://www.dbinvent.com/dist/evaluation.license"
assets= [
    {source = "target/release/rdbm", dest = "/usr/bin/rdbm", mode ="755"},
    {source = "evaluation.license", dest = "/etc/rdbm/", mode ="664", config = true},
    {source = "lib-licenses.txt", dest = "/usr/share/doc/rdbm/lib-licenses.txt", mode = "644", doc = true},
    {source = "COPYRIGHT", dest = "/usr/share/doc/rdbm/copyright", mode = "644", doc = true},
    {source = "LICENSE", dest = "/usr/share/doc/rdbm/LICENSE", mode = "644", doc = true},
]

[package.metadata.generate-rpm.requires]
postgresql-client = "*"
curl = "*"
