[package]
name = "rdbm"
version = "0.1.0"
authors = ["vk <vk@dbinvent.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# https://doc.rust-lang.org/reference/linkage.html
[lib]
name = "rdbm"
path = "src/lib.rs"
crate-type = ["rlib", "dylib"]
#crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "rdbm"
path = "src/main.rs"

[dependencies]
slog = "^2.7.0"
slog-async = "^2.6.0"
slog-envlogger = "^2.2.0"
slog-stdlog = "^4.1.0"
slog-term = "^2.8.0"
sloggers = "^1.0.1"
lazy_static = "^1.4.0"
postgres = "^0.19.1"
postgres-openssl = "^0.5.0"
openssl = "^0.10.33"

serde = { version = "^1.0", features = ["derive"] }

serde_json = "^1.0.64"
yaml-rust = "^0.4.5"
semver = "^0.11.0"


crypto-hash = "^0.3.4"
rand = "^0.8.3"
base64 = "^0.13.0"
clap = {version = "2.33.3", features = ["yaml"]}

