
---
uri: grant
schema:
  type: object
  # grant those privileges to user(s)
  items:
    select:
      type: string
    insert:
      type: string
    update:
      type: string
    delete:
      type: string
    truncate:
      type: string
    references:
      type: string
    trigger:
      type: string
    create:
      type: string
    connect:
      type: string
    temporary:
      type: string
    execute:
      type: string
    usage:
      type: string
    # optional WITH GRANT OPTION
    with_grant_option:
      type: boolean
    # optional GRANTED BY
    by:
      type: string

---
uri: column
schema:
  type: object
  items:
    column:
      type: object
      items:
        name:
          type: string
        type:
          type: string
        defaultValue:
          type: string
        constraint:
          type: object
          items:
            primaryKey:
              type: boolean
            nullable:
              type: boolean
            foreignKey:
              type: object
              items:
                references:
                  type: string
                sql:
                  type: string
        description:
          type: string
        sql:
          type: string

---
uri: trigger
schema:
  type: object
  items:
    trigger:
      type: object
      items:
        name:
          type: string
        event:
          type: string
        when:
          type: string
        proc:
          type: string

---
uri: etl
schema:
  type: object
  items:
    file:
      type: string
#    view:
#      type: string
#    auto:
#      type: boolean
#    sql:
#      type: string

---
uri: table
schema:
  type: object
  items:
    table:
      type: object
      items:
        tableName:
          type: string
        description:
          type: string
        constraint:
          type: string
        sql:
          type: string
        transaction:
          type: string
        columns:
          type: array
          items:
            $ref: column
        triggers:
          type: array
          items:
            $ref: trigger
        etl:
          $ref: etl
        owner:
          type: string
#        grant:
#          type: array
#          items:
#            $ref: grant

---
uri: schema
schema:
  type: object
  items:
    schema:
      type: string
    schemaName:
      type: string
    owner:
      type: string
    tables:
      type: array
      items:
        $ref: table

---
uri: database
schema:
  type: object
  items:
    database:
      type: array
      items:
        $ref: schema

