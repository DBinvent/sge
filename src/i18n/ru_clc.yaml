name: sge
version: "local_build"
author: DBinvent
about: |

 Учёт выполненных SQL-скриптов и развёртывание базы данных PostgreSQL по описанию схемы в формате YAML.
 Подробнее: 'sge help migrate'.
usage: |
  sge [ПАРАМЕТР]... [КОМАНДА]
  Начните с 'sge help migrate', затем посмотрите 'sge help' и 'sge help snapshot'.

subcommands:
    - migrate:
        about: "Миграция базы данных с ETL до заданной версии: выполнение всех подходящих скриптов. Примеры: https://github.com/DBinvent/sge/tree/main/examples"
        help: |
          Миграция базы данных до версии, заданной в '--target', ИЛИ
          в параметре отдельного этапа: '--pre_deploy', '--schema_deploy', '--version_deploy', '--rr_deploy',
          скриптами из '--source' (без просмотра подкаталогов, если '--source_recur' выключен)
          в базу с именем из '--db_name'; журнал выполнения сохраняется в '--logdb_name' и/или в '--db_name', если '--logdb_name' не задан, а '--logdb' настроен.
          База данных и её пользователь создаются при необходимости, если задан '--createdb' и правильно настроены учётные данные '--createdb_xxx', независимо от '--dry_run'.
          Исполнитель миграции записывается в журнал по значению '--executed_by'.
          Также записываются '--script_tag', '--db_target' и '--db_catalog', если они заданы в параметрах или конфигурации. Эти значения полезны в микросервисной архитектуре (подробнее: dbinvent.com/sge) и при оркестрации окружений.

          Порядок выполнения: (P)->(S)->(V)->(R)->(after)

          т.е. (P)reDeploy SQL — предварительные скрипты, (S)chema YAML — схема, (V)ersion SQL — версионные скрипты, (R)e-runable SQL — повторяемые скрипты, (a)fter (each) — SQL после (каждой) миграции.
          (P)reDeploy SQL выполняется до (S)chema YAML.
          (S)chema YAML сверяется с information schema базы, и недостающие изменения применяются. Здесь же загружаются данные (D).
          (V)ersion SQL — основной набор файлов для обновления базы: каждый выполняется один раз и записывается в таблицу журнала.
          (R)e-runnable SQL удобен для обновления хранимых процедур, а с '--script_tag' их легко отслеживать.
          (P) и (V) проверяют версию и выполняются, если этой версии ещё нет в целевой базе, вплоть до целевой версии.
          Скрипты (P) и (V) также проверяются на неизменность: если скрипт изменился и задан '--checksum', миграция завершается ошибкой.
          Скрипт (S) проверяет целевую версию и применяет изменения, которых ещё нет в целевой базе.
          Скрипт (R) проверяет контрольную сумму файла и выполняется, если файл изменился и ещё не выполнялся на базе.
          'after.sql' и 'after_each.sql' (имена настраиваются) выполняются всегда, но в журнал не записываются.
          '--config_file' или '-c' — текстовый файл со всеми параметрами по имени (без префикса --). Параметры командной строки переопределяют значения из файла.
          '--snapshot_data' и '--etl' загружают данные (ETL) вместе с YAML-схемой.

          Пример правил ETL для YAML-файла с двумя таблицами, table_a и table_b, у которых поле 'table.etl.file' указывает на CSV-файл:
           > sge --etl=skip --snapshot_data=table_a --source_dir=./sql migrate
           >> CSV для table_a не загружается. table_b.etl.file загружается из каталога ./sql/.

           > sge --etl=clean --snapshot_data=table_a --source_dir=./sql --snapshot_to=./data  migrate
           >> Правило 'clean' для table_a (лишние записи удаляются), 'apply' для table_b. CSV-файлы ищутся в каталоге ./data/.

           > sge --etl=force --snapshot_data=table_a  migrate
           >> Правило 'force' для table_a (существующие записи обновляются), 'apply' для table_b. YAML- и CSV-файлы ищутся в каталоге ./.

           > sge --etl=ignore migrate
           >> Отсутствие нужного файла — не ошибка; иначе действует правило 'apply'.

           > sge --etl=skip migrate
           >> Никаких задач ETL ни для одной таблицы.

           > sge migrate
           >> Для table_a и table_b действует правило по умолчанию 'apply'.
           >> Записи берутся из CSV-файлов, указанных в table.etl.file, относительно текущего каталога.
           >> В CSV-файле обязательна строка заголовка.

          '--dry_run' — без изменений в базе.

          Остальные параметры: 'sge help'.

          Подробнее и рекомендации: https://www.dbinvent.com/sge

    - prepare:
        about: "Создание таблицы журнала для учёта выполнения скриптов"
        help: "Создание таблицы журнала '--table' в схеме '--schema' в базе '--logdb_name', если она задана, иначе в '--db_name'. '--dry_run' — без изменений в базе. Остальные параметры: 'sge help'."
    - snapshot:
        about: "Снимок схемы базы в файл '--snapshot_to' в формате yaml или json."
        help: |
          Снимок схемы базы данных в файл (или каталог) '--snapshot_to' в формате yaml или json.

          '--snapshot_version' задаёт номер в имени файла D<номер>__db_name.yaml.

          '--snapshot_data' задаёт список таблиц, данные которых выгружаются (ETL, извлечение) вместе с YAML-схемой.

          '--etl' вместе с '--snapshot_data' используется в 'sge migrate' для загрузки (ETL) данных в целевую базу.

          Примечание: из pg_catalog и information_schema переносятся не все сведения о столбцах,
          нужные для полного соответствия формату вручную написанной YAML-схемы.
          Поэтому снимок схемы и исходный YAML-файл в некоторых случаях могут различаться.

          Некоторые типы, например массивы, в снимке не поддерживаются.

          Остальные параметры: 'sge help'.
    - info:
        about: "Состояние развёртывания и теги версий в формате JSON. См. '--info_format'."
        help: "Состояние развёртывания и теги версий в формате JSON. См. '--info_format'."
args:
    - db_url:
        long: db_url
        takes_value: true
        help: |
            URL разбирается на имя базы, хост и т.д. Значения, уже заданные иначе (в том числе переменными окружения), имеют приоритет.
            Формат: 'postgres://' (см. https://www.postgresql.org/docs/current/libpq-connect.html) ИЛИ пары key=value через пробел
    - db_name:
        long: db_name
        default_value: $USER
        help: "Имя базы данных PostgreSQL"
    - db_host:
        long: db_host
        default_value: /var/run/postgresql
        help: "Хост PostgreSQL"
    - db_port:
        long: db_port
        default_value: "5432"
        help: "Порт PostgreSQL"
    - db_user:
        long: db_user
        default_value: $USER
        help: "Пользователь базы данных; по умолчанию текущий пользователь $USER"
    - db_password:
        long: db_password
        takes_value: true
        help: "Пароль или SSL-сертификаты (см. параметры db_sslxxx)"
    - db_sslmode:
        long: db_sslmode
        default_value: verify-full
        help: "Режим SSL (sslmode)"
    - db_sslrootcert:
        long: db_sslrootcert
        takes_value: true
        help: "Корневой сертификат (CA) сервера: /path/to/server-ca.crt"
    - db_sslcert:
        long: db_sslcert
        takes_value: true
        help: "Сертификат клиента: /path/to/client.crt"
    - db_sslkey:
        long: db_sslkey
        takes_value: true
        help: "Ключ клиента: /path/to/client.key"
    - logdb:
        long: logdb
        default_value: "copy"
        possible_values: [primary, copy]
        help: "Роль базы журнала: primary ИЛИ copy. При primary таблица журнала не создаётся в основной целевой базе, вместо неё используется база журнала."
    - logdb_url:
        long: logdb_url
        takes_value: true
        help: "URL разбирается на имя базы, хост и т.д. Значения, уже заданные иначе, имеют приоритет"
    - logdb_name:
        long: logdb_name
        takes_value: true
        help: "Имя базы журнала выполнения. Если не задано, используется конфигурация 'db_***'"
    - logdb_host:
        long: logdb_host
        default_value: /var/run/postgresql
        help: "Хост базы журнала. Если не задан, используется конфигурация 'db_***'"
    - logdb_port:
        long: logdb_port
        default_value: "5432"
        help: "Порт базы журнала. Если не задан, используется конфигурация 'db_***'"
    - logdb_user:
        long: logdb_user
        takes_value: true
        help: "Пользователь базы журнала. Если не задан, используется конфигурация 'db_***'"
    - logdb_password:
        long: logdb_password
        takes_value: true
        help: "Пароль или SSL-сертификаты базы журнала (см. параметры xx_sslxxx)"
    - logdb_sslmode:
        long: logdb_sslmode
        default_value: "verify-full"
        takes_value: true
        help: "Режим SSL базы журнала. Если не задан, используется конфигурация 'db_***'"
    - logdb_sslrootcert:
        long: logdb_sslrootcert
        takes_value: true
        help: "Корневой сертификат SSL базы журнала, например /path/to/server-ca.crt. Если не задан, используется конфигурация 'db_***'"
    - logdb_sslcert:
        long: logdb_sslcert
        takes_value: true
        help: "Файл сертификата SSL базы журнала, например /path/to/client.crt. Если не задан, используется конфигурация 'db_***'"
    - logdb_sslkey:
        long: logdb_sslkey
        takes_value: true
        help: "Файл ключа SSL базы журнала: /path/to/client.key. Если не задан, используется конфигурация 'db_***'"
    - target:
        long: target
        default_value: "*"
        help: "Целевая версия, до которой отбираются файлы для миграции. Значение по умолчанию для '--pre_deploy', '--schema_deploy', '--version_deploy', '--rr_deploy'."
    - pre_deploy:
        long: pre_deploy
        default_value: "*"
        help: |
            Отбор файлов (P)re Deploy — предварительных скриптов: подходящих по версии, при выполнении проверяется, какие ещё не выполнены. Выполняются до файла (S)chema.
            Значение по умолчанию для миграции задаёт '--target'.
    - schema_deploy:
        long: schema_deploy
        default_value: "*"
        help: |
            Отбор файлов (S)chema — схем для развёртывания, до целевой версии (* — все).
            YAML-файлы схемы разбираются, сравниваются с information schema базы, и в таблицы добавляются недостающие столбцы.
            Существующие столбцы не изменяются и не удаляются.

            Значение по умолчанию для миграции задаёт '--target'.
    - checksum:
        long: checksum
        default_value: "true"
        help: "Ошибка развёртывания при несовпадении контрольных сумм скриптов (P)re и (V)ersion — уже выполненных и записанных в журнал и найденных в каталоге исходников. Это помогает держать файлы одинаковыми во всех окружениях."
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - rr_deploy:
        long: rr_deploy
        default_value: "*"
        help: |
            Отбор файлов (R)e-runable — повторяемых скриптов. У подходящих по версии файлов проверяется контрольная сумма: если файл ещё не выполнялся или изменился, скрипт выполняется.
            Значение по умолчанию для миграции задаёт '--target'.
    - schema:
        long: schema
        default_value: public
        help: "Схема, в которой находится таблица журнала развёртывания ('table')"
    - schema_transaction:
        long: schema_transaction
        default_value: file
        help: |
          Переопределяет параметр database.schema.table.transaction файла (S)chema

          - file: (по умолчанию) файл (S)chema выполняется в одной транзакции. Так файл отмечается как OK, только если применены все его изменения, — или не применено ни одного.

          - table: все изменения каждой таблицы — в отдельной транзакции.

          - retry: повтор изменений ALTER, если блокировку не удалось получить за одну секунду, — до 100 раз

          Значение параметра переопределяет значение из файла (S)chema при выполнении миграции.
    - version_transaction:
        long: version_transaction
        takes_value: true
        help: |
          Переопределяет режим выполнения файла (V)ersion в psql:

          - single: (по умолчанию) файл (V)ersion выполняется с параметром psql --single-transaction.

          - statement: psql выполняется без --single-transaction. То же задаёт первая строка файла со значением 'false', например: --single-transaction=false
    - table:
        long: table
        default_value: sge_history
        help: "Имя таблицы журнала развёртывания в схеме 'schema'"
    - source_dir:
        long: source_dir
        default_value: "./"
        help: "Каталог со скриптами; подкаталоги просматриваются при <source_recur>"
    - source_git:
        long: source_git
        takes_value: true
        help: "URL git-репозитория как источник скриптов; пусто — используется <source_dir> на диске"
    - source_git_ref:
        long: source_git_ref
        takes_value: true
        help: "Ветка, тег или коммит для развёртывания; по умолчанию HEAD удалённого репозитория"
    - source_git_dir:
        long: source_git_dir
        takes_value: true
        help: "Подкаталог репозитория со скриптами"
    - source_git_cache:
        long: source_git_cache
        takes_value: true
        help: "Где хранятся клоны; по умолчанию <tmp>/sge-git"
    - source_git_depth:
        long: source_git_depth
        takes_value: true
        default_value: "1"
        help: "Глубина поверхностного клона (shallow clone); 0 — вся история"
    - source_git_ssh_key:
        long: source_git_ssh_key
        takes_value: true
        help: "Файл ключа (identity file) для URL git по ssh; пусто — ключами распоряжается ssh-agent"
    - source_git_known_hosts:
        long: source_git_known_hosts
        takes_value: true
        help: "Файл known_hosts для git по ssh; по умолчанию — рядом с <source_git_cache>"
    - source_git_credentials:
        long: source_git_credentials
        takes_value: true
        help: "Путь к файлу учётных данных git (в формате, который пишет `git credential-store`) для источника http(s). Именно ПУТЬ, а не токен: argv доступен любому локальному пользователю."
    - source_zip:
        long: source_zip
        takes_value: true
        help: "Zip-архив как источник скриптов: на время запуска распаковывается в <source_zip_tmp>/<имя архива>/ и удаляется по его окончании, успешном или нет; пусто — используется <source_dir> на диске"
    - source_zip_dir:
        long: source_zip_dir
        takes_value: true
        help: "Подкаталог архива со скриптами"
    - source_zip_tmp:
        long: source_zip_tmp
        takes_value: true
        help: "Куда распаковываются архивы; по умолчанию системный временный каталог"
    - source_zip_max_mb:
        long: source_zip_max_mb
        takes_value: true
        default_value: "1024"
        help: "Наибольший объём, до которого может распаковаться архив, в МиБ"
    - source_recur:
        long: source_recur
        default_value: "true"
        help: "Просматривать каталог рекурсивно"
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - executed_by:
        long: executed_by
        takes_value: true
        help: "Имя пользователя, выполняющего миграцию"
    - script_tag:
        long: script_tag
        takes_value: true
        help: "Тег для выполненных скриптов (строк журнала)"
    - db_target:
        long: db_target
        takes_value: true
        help: "Цель (target) — имя базы данных; пустая строка, если таблица журнала в той же базе; ИЛИ окружение (dev|prod) + хост (узел) + база для оркестрации."
    - db_catalog:
        long: db_catalog
        takes_value: true
        help: "Имя набора схем базы / модулей / микросервисов."
    - version_deploy:
        long: version_deploy
        default_value: "*"
        help: "Развёртывание файлов (V)ersion до целевой версии (* — все)"
    - dry_run:
        long: dry_run
        default_value: "false"
        help: |
          Сгенерировать весь SQL, но не выполнять его на базе (КРОМЕ 'CREATE DATABASE' / 'CREATE ROLE'), а также записать в лог все попытки выполнить файлы скриптов.
          Чтобы не выполнять 'CREATE DATABASE'/'CREATE ROLE', уберите параметр '--createdb' или задайте ему false.
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - dry_run_to:
        long: dry_run_to
        takes_value: true
        help: "Файл, в который записывается сгенерированный SQL-скрипт"
    - out_format:
        long: snapshot_format
        default_value: yaml
        possible_values: [yaml, json]
        help: "Формат сведений о схеме базы, создаваемых командой 'snapshot'; см. также параметр '--snapshot_to'."
    - snapshot_to:
        long: snapshot_to
        takes_value: true
        help: |
          Файл для снимка структуры базы данных. Используется командой snapshot.

          '--snapshot_version' переопределяет номер 'D<next>__' в имени создаваемого файла.

          Если значение — каталог, файл в нём называется 'D<next>__<database_name>.yaml'.
    - snapshot_version:
        long: snapshot_version
        help: |
          Переопределяет номер версии в именах файлов, создаваемых по '--snapshot_to' и '--snapshot_data'.
        takes_value: true
    - snapshot_data:
        long: snapshot_data
        takes_value: true
        help: |
          Имена таблиц для выгрузки, через запятую.

          Имя файла: 'D<next>__<schema_name>_<table_name>.csv'.

          Файл сохраняется в каталог 'snapshot_data' или в текущий каталог.

          В имени таблицы допускается подстановка (*).

          '--snapshot_version' переопределяет номер 'D<next>__' в имени создаваемого файла.

          Настройка для миграции: см. '--etl'.

          Необязательно: через двоеточие — представление (view), из которого читать вместо таблицы.
#          Пример: table_a,schema.table_b,table_c:view_c,schema.table_d:schema.view_d
    - etl:
        long: etl
        help: |
          Действие ETL при миграции: загрузка данных из CSV-файла, имя которого задано в поле 'table.etl.file' YAML-файла схемы.
          Если имя CSV-файла имеет вид 'D<номер или версия>__', номер задаёт порядок загрузки данных. Это не целевая версия развёртывания.

          Если задан '--snapshot_data', правило ETL переопределяется для этих таблиц.

          Файлы данных в поле 'table.etl.file' YAML — относительные имена файлов в формате CSV.
          Файлы ищутся в '--snapshot_to' или, если '--snapshot_to' не задан, в '--source_dir'.
          ETL ничего не делает, если файл данных не менялся с предыдущей успешной миграции.

          Правила:

          - clean: вставка ИЛИ обновление полей, если запись с таким первичным ключом есть; записи, которых нет в файле, удаляются из таблицы.

          - force: вставка ИЛИ обновление полей, если запись с таким первичным ключом есть. Без первичного ключа вставляются только отсутствующие записи.

          - apply: вставка ИЛИ пропуск, если запись с таким первичным ключом есть.

          - ignore: отсутствие нужного файла — не ошибка; иначе действует правило 'apply'.

          - skip: данные не загружаются вовсе.

        default_value: "apply"
        takes_value: true
        possible_values: [clean, force, apply, ignore, skip]
