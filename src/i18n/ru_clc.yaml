    - config_file:
        long: config
        short: c
        takes_value: true
        help: |
            Загрузить все параметры из файла конфигурации (разделитель : или =);
            параметры командной строки переопределяют загруженные из файла.

            Если параметр не задан ни там, ни там, ищется переменная окружения (имя ЗАГЛАВНЫМИ буквами).

            Если и её нет, используется значение по умолчанию (если оно есть).

            Поддерживаются YAML, Properties, conf, cfg, JSON, env и другие текстовые форматы, где ключ и значение в строке разделены ':' или '='.

            'Ключ' приводится к нижнему регистру, со 'значения' снимаются кавычки. Избегайте многострочных значений, взятых в кавычки только в первой и последней строке!

            Примечание: дополнительный порядок приоритетов — см. '--db_url' и '--logdb_url'
    - after:
        long: after
        default_value: "after.sql"
        takes_value: true
        help: "Скрипт, который ищется и выполняется после успешной миграции и фиксации журнала. Если скрипт не найден, это не ошибка. Его выполнение не записывается в таблицу журнала."
    - after_each:
        long: after_each
        default_value: "after_each.sql"
        takes_value: true
        help: "Скрипт, который ищется и выполняется после выполнения каждой версии. Если скрипт не найден, это не ошибка. Его выполнение не записывается в таблицу журнала."
    - createdb:
        long: createdb
        default_value: "false"
        help: "Создать базу, если db_name/logdb_name не существует: она создаётся с теми же учётными данными через базу postgres"
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - verbose:
        long: verbose
        default_value: "false"
        help: "Включить журналирование уровня DEBUG."
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - createdb_user:
        long: createdb_user
        default_value: postgres
        help: "Пользователь базы для шага 'Create DB' (создание базы)."
    - createdb_pwd:
        long: createdb_pwd
        takes_value: true
        help: "Пароль пользователя для шага 'Create DB'. Если не задан, используются db_sslxxx."
    - createdblog_user:
        long: createdblog_user
        default_value: postgres
        help: "Пользователь базы для шага 'Create LOGDB' (создание базы журнала). Используется, если задан logdb_name."
    - createlogdb_pwd:
        long: createlogdb_pwd
        takes_value: true
        help: "Пароль пользователя для шага 'Create LOGDB'. Если не задан, используются logdb_sslxxx."
