    - config_file:
        long: config
        short: c
        takes_value: true
        help: |
            設定ファイル（: または = 区切り）からすべてのオプションを読み込みます。
            コマンドラインのオプションはファイルから読み込んだ値より優先されます。

            どちらにも設定されていなければ、環境変数（大文字の名前）を探します。

            それでも見つからなければ、デフォルト値（あれば）を使います。

            対応形式：YAML、Properties、conf、cfg、JSON、env など、キーと値を ':' または '=' で区切ったテキストファイル。

            'キー' は小文字にされ、'値' の引用符は外されます。最初と最後の行だけを引用符で囲んだ複数行の値は避けてください！

            注意：その他の優先順位は '--db_url' と '--logdb_url' を参照してください
    - after:
        long: after
        default_value: "after.sql"
        takes_value: true
        help: "マイグレーションが成功し履歴をコミットした後に、このスクリプトを探して実行します。見つからなくても失敗しません。このスクリプトの実行は履歴テーブルに記録されません。"
    - after_each:
        long: after_each
        default_value: "after_each.sql"
        takes_value: true
        help: "各バージョンの実行後に、このスクリプトを探して実行します。見つからなくても失敗しません。このスクリプトの実行は履歴テーブルに記録されません。"
    - createdb:
        long: createdb
        default_value: "false"
        help: "db_name/logdb_name が存在しなければデータベースを作成します。同じ認証情報で postgres データベース経由で作成します"
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - verbose:
        long: verbose
        default_value: "false"
        help: "DEBUG ログを有効にします。"
        possible_values: [yes, no, ok, y, "1", "true", "false"]
    - createdb_user:
        long: createdb_user
        default_value: postgres
        help: "'Create DB'（データベース作成）ステップで使うデータベースユーザー。"
    - createdb_pwd:
        long: createdb_pwd
        takes_value: true
        help: "'Create DB' ステップで使うユーザーのパスワード。未設定なら db_sslxxx を使います。"
    - createdblog_user:
        long: createdblog_user
        default_value: postgres
        help: "'Create LOGDB'（履歴データベース作成）ステップで使うデータベースユーザー。logdb_name が設定されているときに使います。"
    - createlogdb_pwd:
        long: createlogdb_pwd
        takes_value: true
        help: "'Create LOGDB' ステップで使うユーザーのパスワード。未設定なら logdb_sslxxx を使います。"
