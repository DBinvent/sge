[build]
# Target musl-libc by default when running Cargo.
target = "x86_64-unknown-linux-musl"
rustflags = ["-Clinker=rust-lld", "-C", "target-feature=+crt-static"]
#rustflags = ["-Clinker=rust-lld"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

