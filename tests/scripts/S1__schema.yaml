# databaseChangeLog
database:
  - schema: # changeSet
    schemaName: test_schema
    owner: postgres
    tables: # changes for tables
      - table: # createTable
        tableName: test_table
        description: The new table
        constraint: -- some SQL as table constraint
        sql: -- some SQL suffix on table create
        transaction: -- single (default) OR table OR column OR retry (wrap to psql)
        columns:
          - column:
            name: id
            type: serial
            defaultValue:
            constraint: # changes on PK & NULL wont apply
              primaryKey: true
              nullable: false
              foreignKey:
                references: fk_table
                sql: -- some SQL suffix on new FK create- on delete no action on update no action
            description:
            sql: -- some SQL suffix on new column create
          - column:
            name: test
            type: varchar(250)

        triggers: # will generate SQL, if trigger name is absent and proc is valid:
          - trigger: # CREATE TRIGGER {name} {event} ON {tableName} {when} EXECUTE PROCEDURE {proc}
            name: uniq_name_of_trigger
            event: before update
            when: for each row
            proc: -- p()
