database:
  - schema:
    schemaName: test_schema
    owner: postgres
    tables:
      - table:
          tableName: test_table
          columns:
            - column:
                name: tr
                type: int
                constraint:
                  foreignKey:
                    references: test_ref_table
          data_file: D1__test.csv

      - table:
          tableName: test_ref_table
          columns:
            - column:
                name: id
                type: serial
                defaultValue:
                constraint:
                  primaryKey: true
                  nullable: false
            - column:
                name: test
                type: varchar(20)
          data_file: D1__test_ref.csv
