name: trivy

# Trivy: known vulnerabilities, secrets and misconfigurations. Two scans:
# - fs: the repository - Cargo.lock's crates, committed secrets, the Dockerfiles
# - image: dbinvent/sge as the Dockerfile builds it - Alpine and its psql, which
#   cargo audit does not see
# Each gives its findings to Code scanning (the Security tab), then fails the run on
# a HIGH or CRITICAL one that has a fix. A finding to accept goes in .trivyignore.
# On a push and a pull request (Dependabot's among them), and weekly: an advisory
# can come out with nothing changed here.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # the SARIF upload
    steps:
      - uses: actions/checkout@v7
      # pinned to a commit, not a tag: trivy-action's tags were force-pushed to
      # malicious code in March 2026. Dependabot bumps the pin.
      - name: scan, all findings to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: gate, HIGH and CRITICAL with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # the image as dist/build.sh would build it, kept local: nothing is pushed
      - run: docker build -t dbinvent/sge:trivy .
      - name: scan, all findings to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dbinvent/sge:trivy
          format: sarif
          output: trivy-image.sarif
          trivyignores: .trivyignore
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: gate, HIGH and CRITICAL with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dbinvent/sge:trivy
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true
