name: Publish sge .deb

# Path-scoped, like trust-atria-srv's: only what can change the package should
# cut a release, not a README edit.
on:
  workflow_dispatch:
  push:
    # main only: a push to another branch - a Dependabot update's - is no release
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    # Pinned to a tag, not @main - bump deliberately, so an edit in infra_apt
    # cannot silently change this pipeline.
    uses: DBinvent/infra_apt/.github/workflows/publish-apt.yml@v3
    with:
      project: sge
      # the .deb's package name (cargo-deb's, from the crate schema_guard): its old
      # build is removed from the distribution before the new one goes in
      package: schema-guard
      # into YT Cluster's distribution of apt.dbinvent.com, /media/lab/repo - one
      # sources.list line for both (dbinvent.com's sge page): the publish step copies
      # dist/repo-conf/distributions over that root's, so it is that root's own
      codename: yt-cluster
      repo_dir: /media/lab/repo
      build_script: ./dist/build.sh
      conf_dir: ./dist/repo-conf
      cleanup_docker: false   # nothing here builds in docker
    secrets:
      gpg_key: ${{ secrets.GPG_KEY }}
