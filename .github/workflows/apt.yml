name: Publish sge

# Every commit or merge on main publishes: the apt and yum packages, the tarball and
# the Docker image - a README or workflow edit too, as the same version again.
on:
  workflow_dispatch:
  push:
    # main only: a push to another branch - a Dependabot update's - is no release
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    # Pinned to a tag, not @main - bump deliberately, so an edit in infra_apt
    # cannot silently change this pipeline.
    uses: DBinvent/infra_apt/.github/workflows/publish-apt.yml@v5
    with:
      project: sge
      # the package's name, deb and rpm (cargo-deb's, from the crate schema_guard;
      # [package.metadata.generate-rpm]): its old build is removed from the
      # distribution before the new one goes in
      package: schema-guard
      # into YT Cluster's distribution of apt.dbinvent.com, /media/lab/repo - one
      # sources.list line for both (dbinvent.com's sge page): the publish step copies
      # dist/repo-conf/distributions over that root's, so it is that root's own.
      # The rpm into its yum repository there too, yum/el9
      codename: yt-cluster
      repo_dir: /media/lab/repo
      # the deb, the rpm, the tarball and the image (see the script)
      build_script: ./dist/build.sh
      # the tarball: paks/sge-latest.tar.gz
      pak_name: sge
      # the image dist/build.sh built and checked on docker_host, pushed from there
      docker_image: dbinvent/sge
      # docker is lab10's, not the runner's (lab3): the build and the push go to it over
      # ssh, as the runner's user. The runner's service has no login profile, so the
      # DOCKER_HOST of a shell there is not its: it is named here
      docker_host: ssh://lab10
      docker_description: "Schema Guard: PostgreSQL schema migration, SQL scripts and declarative YAML (MIT)"
      docker_readme: dist/dockerhub.md
      # lab3's labels: the self-hosted runner that holds the signing key and /media/lab/repo
      runner: '["self-hosted", "Linux", "X64"]'
      conf_dir: ./dist/repo-conf
      # off: the cleanup is docker system prune -a on the runner's own daemon (lab3),
      # which builds nothing - and lab10's holds other projects' images (dbinvent/yt)
      cleanup_docker: false
    secrets:
      gpg_key: ${{ secrets.GPG_KEY }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}
